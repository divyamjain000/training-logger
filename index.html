<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#272e35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-512.png">
<title>Lift Log</title>
<style>
:root{--bg:#272e35;--card:#323a42;--line:#4b5560;--tx:#eef1f8;--mut:#a9b1c8;--ok:#5fe39a;--warn:#fbbf24;--bad:#ff8a8a;--acc:#3d9bf2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:calc(120px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:max(10px,env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:999px;padding:8px 13px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#07101f;font-weight:600}
.sync{margin-left:auto;font-size:12px;color:var(--mut);white-space:nowrap;background:none;border:0;padding:8px 4px}
.sync b{color:var(--warn)}
.wk{margin-top:8px}
.startbtn{width:100%;height:46px;border:0;border-radius:12px;background:var(--ok);color:#06210f;font-size:17px;font-weight:700}
.startbtn:disabled{opacity:.6}
.clock{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.stat{font-size:13px;color:var(--mut)}
.fin{margin-left:auto;background:var(--bad);color:#2a0a0a;border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-size:15px}
.linkbtn{margin-left:auto;background:none;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:8px 14px;font-size:14px}
main{padding:10px 12px}
.ttl{font-size:20px;font-weight:700;margin-left:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{background:none;border:0;color:var(--acc);font-size:32px;line-height:1;padding:0 10px 4px 0}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.dcard.today{border-color:var(--acc)}
.dh{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.dt{font-size:19px;font-weight:700}
.dsub{font-size:12px;color:var(--mut)}
.ed{margin-left:auto;background:none;border:0;color:var(--mut);font-size:18px;padding:4px 8px}
.exl{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0;border-top:1px solid var(--line)}
.exl span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exl span:last-child{color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.more{font-size:12px;color:var(--mut);padding-top:6px}
.resume{background:#1f4a37;border:1px solid var(--ok);border-radius:14px;padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.resume b{font-variant-numeric:tabular-nums;font-size:20px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;padding:12px 10px}
.exh{display:flex;gap:8px;align-items:flex-start;padding:0 4px 8px}
.exh .t{font-weight:600}
.exh .s{font-size:12px;color:var(--mut);margin-top:2px}
.exh .n{margin-left:auto;font-size:13px;color:var(--mut);text-align:right;white-space:nowrap}
.xt{color:var(--acc);font-variant-numeric:tabular-nums}
.why{font-size:12px;color:var(--acc);margin-top:3px}
.sets{display:grid;grid-template-columns:36px 1fr 72px 62px 44px;gap:6px;align-items:center}
.sh{font-size:11px;color:var(--mut);text-align:center;text-transform:uppercase}
.sn{height:40px;border:0;background:#323a42;border-radius:8px;color:var(--tx);font-weight:700;font-size:15px}
.sn.tg{box-shadow:inset 0 0 0 1px var(--warn)}
.sn.pr{box-shadow:inset 0 0 0 1px var(--ok)}
.pv{height:40px;border:0;background:none;color:var(--mut);font-size:14px;font-variant-numeric:tabular-nums;padding:0}
.in{width:100%;min-width:0;height:40px;text-align:center;font-size:17px;font-weight:600;background:#323a42;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:0}
.in.done{background:#1f4a37;border-color:#2f7a52}
.ck{height:40px;border-radius:8px;border:1px solid var(--line);background:#323a42;color:transparent;font-size:20px;font-weight:700;padding:0}
.ck.on{background:var(--ok);border-color:var(--ok);color:#06210f}
.tagp{grid-column:1/-1;background:#323a42;border-radius:10px;padding:4px 10px 8px}
.tg{display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap}
.tg span{font-size:12px;color:var(--mut);width:52px}
.tg .chip{padding:6px 11px;font-size:13px}
.link{background:none;border:0;color:var(--mut);font-size:13px;padding:8px 4px}
.addset{width:100%;margin-top:8px;height:36px;border:0;border-radius:8px;background:#4b5560;color:var(--tx);font-size:14px}
.best{font-size:12px;color:var(--mut)}
.xov{position:fixed;inset:0;background:var(--bg);z-index:30;overflow-y:auto;padding:max(12px,env(safe-area-inset-top)) 14px 40px;display:none}
.xov.on{display:block}
.xh2{display:flex;align-items:center}
.cc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.cch{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.cct{font-weight:700;font-size:16px}.ccs{font-size:12px;color:var(--mut);margin-top:2px}
.xb{margin-left:auto;background:#323a42;border:1px solid var(--line);border-radius:8px;color:var(--tx);width:34px;height:34px;font-size:17px}
svg.ch{width:100%;height:auto;display:block;touch-action:pan-y}
svg.ch .ax{fill:var(--mut);font-size:10px}
svg.ch .vl{fill:var(--tx);font-size:11px;font-weight:600}
svg.ch .gl{stroke:var(--line);stroke-width:1}
svg.ch .mk.sel{filter:brightness(1.3)}
svg.ch .hl{fill:#3987e5;stroke:#323a42;stroke-width:2}
svg.ch .xh{stroke:var(--mut);stroke-width:1}
.cap{font-size:13px;color:var(--tx);min-height:20px;margin-top:6px;font-variant-numeric:tabular-nums}
.rng{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.rng .chip{padding:6px 12px;font-size:13px}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none}
.sheetbg.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:14px 14px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom));max-height:82%;overflow-y:auto}
.sheet .ht{margin-bottom:10px;font-size:18px;font-weight:700}
.sopt{display:block;width:100%;text-align:left;background:#323a42;border:1px solid var(--line);border-radius:8px;color:var(--tx);padding:13px 12px;margin-bottom:8px;font-size:15px}
.sopt small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.sheet select,.sheet .sq{width:100%;height:44px;background:#323a42;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:16px;margin-bottom:10px}
.prow{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--tx);padding:12px 2px;font-size:15px}
.cancelbtn{display:block;width:100%;height:46px;margin:14px 0 6px;border:1px solid var(--bad);background:none;color:var(--bad);border-radius:10px;font-size:15px;font-weight:700}
.ssg{position:relative;padding-left:13px;margin-bottom:12px}
.ssg::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:3px;background:var(--c)}
.ssg .ex{margin-bottom:8px}.ssg .ex:last-of-type{margin-bottom:0}
.sstag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c);margin:0 0 5px 2px}
.exr{display:flex;gap:8px;margin-top:8px}.exr .addset{margin-top:0}
.lk{flex:0 0 auto;padding:0 12px;height:36px;border:0;border-radius:8px;background:#4b5560;color:var(--mut);font-size:13px}
.lk.on{background:var(--c);color:#272e35;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.grid2 .dcard{margin-bottom:0;padding:12px;min-width:0}
.grid2 .dt{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid2 .dh{flex-wrap:nowrap;align-items:center;gap:0 8px;margin-bottom:8px}
.grid2 .exl{font-size:12px;padding:5px 0;gap:6px}
.pl{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.pl .r1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pl .t{font-weight:600}
.pl .sr{color:var(--acc);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.pl .s{font-size:12px;color:var(--mut);margin-top:3px}
.ssg .pl{margin-bottom:8px}.ssg .pl:last-of-type{margin-bottom:0}
.pbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(transparent,var(--bg) 35%);padding:26px 14px calc(12px + env(safe-area-inset-bottom))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:#272e35;border-top:1px solid var(--line);display:none;gap:6px;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.nav.on{display:flex}
.nav button{flex:1;border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:6px;padding:7px 4px 6px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{background:var(--acc);border-color:var(--acc);color:#07101f}
.hasnav .bar{bottom:calc(64px + env(safe-area-inset-bottom))}
.hasnav .toast{bottom:calc(150px + env(safe-area-inset-bottom))}
body.hasnav{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin:10px 0}
.bgrid label{font-size:12px;color:var(--mut);display:block;margin-bottom:3px}
.bgrid .bi,.bnote{width:100%;height:42px;background:#323a42;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:0 10px;font-size:16px}
.bnote{margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{background:#323a42;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:13px}
.mchip i{font-style:normal;font-size:11px;color:var(--mut);margin-left:4px}
.mchip i.up{color:var(--warn)}.mchip i.dn{color:var(--ok)}
.delb{float:right;background:none;border:0;color:var(--mut);font-size:16px;padding:0 4px}
.hc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.hc .ht{font-size:19px;font-weight:700}
.hc .hdt{font-size:13px;color:var(--mut);margin:2px 0 10px}
.hg{display:grid;grid-template-columns:1fr auto;gap:7px 14px;font-size:14px;border-top:1px solid var(--line);padding-top:10px}
.hg .hh{font-size:11px;color:var(--mut);text-transform:uppercase}
.hg .hh:nth-child(2),.hg .hv{text-align:right;color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.hg .hn{overflow:hidden;text-overflow:ellipsis}
.bar{position:fixed;left:0;right:0;bottom:0;background:#2f373f;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:none;align-items:center;gap:12px;z-index:6}
.bar.on{display:flex}
.bar.go{background:#1f4a37;border-top-color:var(--ok)}
.bar .big{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));background:#4b5560;border:1px solid var(--line);padding:8px 14px;border-radius:10px;font-size:14px;z-index:9;display:none;max-width:90%;text-align:center}
.setup{padding:20px}
.setup input{width:100%;margin:6px 0 14px;padding:12px;background:#323a42;border:1px solid var(--line);border-radius:10px;color:var(--tx);font-size:15px}
.setup button{padding:12px 18px;border-radius:10px;border:0;background:var(--acc);font-weight:700}
.muted{color:var(--mut);font-size:13px}
.ov{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;padding:max(16px,env(safe-area-inset-top)) 16px 40px;display:none}
.ov.on{display:block}
.ov h2{margin:4px 0 14px}
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}
.kpi b{display:block;font-size:20px}
.kpi span{font-size:12px;color:var(--mut)}
.prrow{background:#1f4a37;border:1px solid #2f7a52;border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.prrow b{color:var(--ok)}
.vrow{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px}
.vrow span:last-child{color:var(--mut);font-variant-numeric:tabular-nums}
.closebtn{width:100%;height:50px;margin-top:18px;border:0;border-radius:12px;background:var(--acc);font-weight:700;font-size:16px}
.mlist{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.16)}
.mrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--tx);padding:15px 16px}
.mrow:last-child{border-bottom:0}
.mrow .mn{font-weight:600}.mrow .mv{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600}
.mrow .chev{color:var(--mut);font-size:20px}
.mv i,.hnum i{font-style:normal;font-size:11px;margin-left:6px;font-weight:600}
.mv i.up,.hnum i.up{color:var(--warn)}.mv i.dn,.hnum i.dn{color:var(--ok)}
.hhead{display:flex;align-items:center;margin-bottom:6px}
.plus{margin-left:auto;width:38px;height:38px;border-radius:50%;border:0;background:var(--acc);color:#10203a;font-size:26px;font-weight:700;line-height:1;padding:0;margin-right:30px}
.hrow{display:flex;align-items:center;gap:8px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.hrow .hnum{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600}
.hrow .delb{float:none;width:22px;padding:0}
.hfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.hfoot div{display:flex;align-items:center;gap:8px;color:var(--mut)}
.hfoot b{font-size:15px;font-weight:600;color:var(--tx);font-variant-numeric:tabular-nums}
.hg{display:block;border-top:0;padding-top:4px}
.hg .hh{display:flex;justify-content:space-between;font-size:16px;font-weight:700;color:var(--tx);text-transform:none;margin:6px 0 8px}
.hg .hr{display:flex;justify-content:space-between;gap:14px;padding:5px 0;font-size:15px}
.hg .hr.ss{border-left:4px solid var(--c);padding-left:14px;border-radius:3px}
.hg .hn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;color:var(--tx)}
.hg .hv{color:var(--tx);white-space:nowrap;font-variant-numeric:tabular-nums}
.hact{margin-left:auto;display:flex;align-items:center;gap:4px}
.ib{position:relative;background:none;border:0;color:var(--tx);padding:6px;border-radius:14px;display:flex}
.ib.on{background:var(--acc);color:#10203a}
.ib i{position:absolute;top:0;right:0;font-style:normal;font-size:10px;background:var(--acc);color:#10203a;border-radius:8px;padding:0 5px;font-weight:700}
.sect{font-size:20px;font-weight:700;margin:8px 4px 12px}
.tsum{font-size:14px;line-height:1.35;color:var(--tx);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:57px}
.tft{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--mut);font-size:14px;min-height:20px}
.dcard .ed{color:var(--acc);font-size:22px;line-height:1;padding:2px 6px;margin-left:auto}
.pop{position:fixed;z-index:60;width:190px;background:#323a42;border-radius:16px;box-shadow:0 12px 34px rgba(0,0,0,.45);padding:4px 0;overflow:hidden}
.pop .pi{display:block;width:100%;text-align:left;background:none;border:0;color:var(--tx);font-size:16px;padding:14px 18px}
.pop .pi.bad{color:#ff8a8a}
.mh{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px 8px;font-weight:700;font-size:17px}
.mh span:last-child{font-size:13px;font-weight:500;color:var(--mut)}
.mh:first-child{margin-top:4px}
/* mock theme: flat outlined cards on slate */
.dcard,.ex,.pl,.hc,.cc,.kpi,.resume{border:1px solid var(--line);box-shadow:none}
.dcard,.ex,.hc,.cc,.resume{border-radius:18px}
.dcard.today{border-color:var(--acc)}
.ttl.big{font-size:44px;font-weight:500;margin:34px 4px 14px;letter-spacing:-.5px}
.prow2{display:flex;align-items:center;gap:16px;margin:6px 2px 22px}
.avatar{width:62px;height:62px;border-radius:50%;background:#e8501e;color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center;flex:none}
.pn{font-size:20px;font-weight:600}.chev{margin-left:auto;font-size:34px;color:var(--tx);padding-right:8px}
.dashh{display:flex;align-items:center;justify-content:space-between;margin:0 2px 12px}
.dashh .ib{color:var(--acc)}
.cc .ed{color:var(--acc);font-size:22px;line-height:1;padding:2px 6px}
.cca{margin-left:auto;display:flex;align-items:center;gap:2px}
.ib.sm{padding:4px;color:var(--acc);background:none}
.exrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--tx);padding:15px 4px;font-size:16px}
.exrow small{color:var(--mut);font-size:12px;white-space:nowrap}
/* soft, rounded look */
body{background:var(--bg)}
header{border-bottom:0;background:linear-gradient(var(--bg) 82%,transparent)}
.dcard,.ex,.pl,.hc,.cc,.kpi,.resume{border-color:transparent;box-shadow:0 4px 14px rgba(0,0,0,.16)}
.dcard,.ex,.hc,.cc,.resume{border-radius:22px}
.pl{border-radius:18px}.kpi{border-radius:18px}
.grid2 .dcard{padding:14px}
.startbtn{border-radius:18px;height:52px}
.fin{border-radius:16px}.linkbtn{border-radius:16px}
.in,.ck,.sn,.addset,.lk,.xb{border-radius:14px}
.in,.ck{border-color:transparent}
.mchip{border-radius:12px}.tagp{border-radius:16px}.sopt{border-radius:16px}
.sheet{border-radius:26px 26px 0 0}.sheet select,.sheet .sq{border-radius:14px}
.toast{border-radius:16px}.cancelbtn{border-radius:16px}
.bar{border-radius:22px 22px 0 0}
.nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));padding:6px;border-radius:28px;background:#323a42;border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.35);gap:4px}
.nav button{border:0;background:transparent;border-radius:22px;padding:8px 2px 7px}
.nav button.on{background:var(--acc);color:#10203a}
.nav{left:0;right:0;bottom:0;border-radius:0;background:#222a30;border:0;border-top:1px solid #38414a;box-shadow:none;padding:8px 4px calc(8px + env(safe-area-inset-bottom));gap:0}
.nav button{flex:1;border:0;background:transparent;color:var(--mut);border-radius:0;padding:4px 0;font-size:13px;font-weight:500;letter-spacing:0;text-transform:none;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button.on{background:transparent;color:#fff;font-weight:700}
.nav button svg{width:26px;height:26px}
.hasnav .bar{bottom:calc(72px + env(safe-area-inset-bottom))}
.hasnav .toast{bottom:calc(150px + env(safe-area-inset-bottom))}
body.hasnav{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
.ttl{font-size:22px}

/* night batch: mock-exact screens */
.ttl.big{margin:26px 4px 18px}
.tb{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.tb .ttl{flex:1;font-size:22px;font-weight:500;margin:0 0 0 8px}

<script>

let pop = null, tlist = store.get('tlist', []), editing = false, showArch = false, arch = store.get('arch', {}), gone = store.get('gone', []), day = null, view = 'home', extra = store.get('extra', {}), xs = store.get('xs', {}), names = store.get('names', {}), links = store.get('links', {}), draft = {}, flushing = false, starting = false;

let exovr = store.get('exovr', {});
let st = store.get('st', {});
// Everything below is synced to the sheet's Settings tab (key, JSON value, updatedAt). Last write wins.
const SYNC = {
  names: [() => names, v => { names = v || {}; }], arch: [() => arch, v => { arch = v || {}; }], gone: [() => gone, v => { gone = v || []; }],
  tlist: [() => tlist, v => { tlist = v || []; }], charts: [() => charts, v => { if (v && v.length) charts = v; }],

function syncSave(key){

const hasContent = v => Array.isArray(v) ? v.length > 0 : (v && typeof v === 'object') ? Object.keys(v).length > 0 : !!v;

    } else if (!queue.some(x => x.kind === 'pref' && x.key === k) && (lt || hasContent(cur))) {

    }

  if (Array.isArray(boot.template)) {
    const has = (d, e) => boot.template.some(t => t.day === d && t.ex === e);
    if (!store.get('linksMig', false)) {
      Object.keys(links).forEach(d => Object.keys(links[d] || {}).forEach(e => {

        if (links[d][e] && row && !(row.data && row.data.ss) && !queue.some(x => x.kind === 'tdata' && x.day === d && x.ex === e)) queue.push({ kind: 'tdata', id: uid(), day: d, ex: e, data: { ss: true } });

      store.set('linksMig', true);
    }
    const L = {};
    boot.template.forEach(t => { if (t.data && t.data.ss) (L[t.day] = L[t.day] || {})[t.ex] = true; });
    queue.filter(x => x.kind === 'tdata').forEach(x => { if (x.data && x.data.ss) (L[x.day] = L[x.day] || {})[x.ex] = true; else if (L[x.day]) delete L[x.day][x.ex]; });
    Object.keys(links).forEach(d => { if (!boot.template.some(t => t.day === d) && hasContent(links[d])) L[d] = links[d]; });
    if (JSON.stringify(L) !== JSON.stringify(links)) { links = L; store.set('links', links); changed = true; }
  }
  store.set('st', st); store.set('q', queue);
  return changed;
}

// ---- helpers
const pad = n => String(n).padStart(2, '0');
boot = normBoot(store.get('boot', null));
function nowStr(d = new Date()){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
function todayKey(){ return nowStr().slice(0,10); }
function defaultDay(){ const g = new Date().getDay(); return (g >= 1 && g <= 5) ? DAYS[g-1] : 'Monday'; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function toast(m, ms = 2200){ const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', ms); }
function num(v, d = 0){ const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? d : n; }
function firstInt(v, d = 0){ const m = String(v).match(/\d+/); return m ? parseInt(m[0], 10) : d; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtW(w){ return Number.isInteger(w) ? String(w) : String(+w.toFixed(2)); }
function fmtDur(s){ s = Math.max(0, Math.floor(s)); const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), x = s%60; return h ? `${h}:${pad(m)}:${pad(x)}` : `${m}:${pad(x)}`; }
function fmtVol(v){ return Math.round(v).toLocaleString('en-US'); }
function e1rm(w, r){ return (w > 0 && r >= 1 && r <= 12) ? w * (1 + r/30) : 0; }
function stepFor(ex){
  const e = ex.toLowerCase();
  if (/barbell|squat|deadlift|bench|hip thrust|press \(machine\)|leg press|hack/.test(e)) return 2.5;
  if (/cable|machine|pulldown|row|fly|curl|raise|pull/.test(e)) return 1.25;
  return 2.5;
}
function running(){ return !!(sess && !sess.ended && sess.date === todayKey()); }
function restFor(ex){ const t = boot && boot.template.find(x => x.ex === ex), o = exMeta(ex).data; return (t && t.rest) || (o && o.rest) || prefs.rest || 90; }

// ---- data
function readQs(){
  const q = new URLSearchParams(location.search);
  if (q.get('u') && q.get('k')) { cfg = { u: q.get('u'), k: q.get('k') }; store.set('cfg', cfg); history.replaceState(null, '', location.pathname); }
}
async function refreshBoot(){
  if (!cfg || !navigator.onLine) return;
  try {
    const r = await fetch(cfg.u + (cfg.u.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(cfg.k), { redirect: 'follow' });
    const j = await r.json();
    if (j.error) { lastErr = j.error; toast(j.error === 'unauthorized' ? 'Wrong secret. Open settings and re-enter it.' : 'Script says: ' + j.error, 4000); return; }

  } catch(e){ lastErr = 'network'; /* offline or cold start, keep cache */ }
}
function holding(){ return store.get('syncMode', 'live') === 'finish' && running(); }
function sendable(force){
  const hold = !force && holding();
  const v5 = boot && boot.v >= 5, v4 = boot && boot.v >= 4, v2 = boot && boot.v >= 2;
  return queue.filter(x => (hold && (x.kind === 'set' || x.kind === 'update' || x.kind === 'delete')) ? false : (x.kind === 'set' || (x.kind === 'finish' && v2) || ((x.kind === 'delete' || x.kind === 'update') && v4) || ((x.kind === 'body' || x.kind === 'bodydel') && v5) || (x.kind === 'tmpl' && boot && boot.v >= 6) || (x.kind === 'tdel' && boot && boot.v >= 7) || ((x.kind === 'pref' || x.kind === 'tdata' || x.kind === 'exercise') && boot && boot.v >= 8)));
}
let lastErr = '';
async function flush(force){
  if (!cfg || flushing || !queue.length || !navigator.onLine) { updSync(); return; }

  if (!send.length) { updSync(); return; }
  flushing = true; updSync();
  const strip = o => { const c = Object.assign({}, o); delete c.kind; return c; };
  const rows = send.filter(x => x.kind === 'set'), fins = send.filter(x => x.kind === 'finish');
  const dels = send.filter(x => x.kind === 'delete'), ups = send.filter(x => x.kind === 'update');
  const bodies = send.filter(x => x.kind === 'body'), bdels = send.filter(x => x.kind === 'bodydel'), tadds = send.filter(x => x.kind === 'tmpl'), tdels = send.filter(x => x.kind === 'tdel'), prefOps = send.filter(x => x.kind === 'pref'), tdatas = send.filter(x => x.kind === 'tdata'), exOps = send.filter(x => x.kind === 'exercise');

async function forceSync(){

// ---- supersets
const PAL = ['#f472b6','#fbbf24','#34d399','#a78bfa','#fb923c','#22d3ee'];

}
function toggleLink(ei){
  const rows = plan(); if (ei >= rows.length - 1) return;

// ---- model
function tmplRows(){
  const dl = queue.filter(x => x.kind === 'tdel');
  return boot.template.filter(t => !dl.some(x => x.day === t.day && (!x.ex || x.ex === t.ex)));
}
function allTmpls(){
  const out = DAYS.filter(d => !gone.includes(d));
  tlist.forEach(d => { if (!out.includes(d) && !gone.includes(d)) out.push(d); });
  if (boot) tmplRows().forEach(t => { if (!out.includes(t.day) && !DAYS.includes(t.day) && !gone.includes(t.day)) out.push(t.day); });

}
function label(d){ return names[d] || d; }
function plan(d = day){
  if (!boot) return [];
  const tmpl = tmplRows().filter(t => t.day === d).sort((a,b) => a.order - b.order);

  const latest = tg.reduce((m, t) => t.date > m ? t.date : m, '');
  const tmap = {}; tg.filter(t => t.date === latest).forEach(t => tmap[t.ex] = t);
  const rows = tmpl.map(t => ({ ex: t.ex, sets: t.sets, lo: t.lo, hi: t.hi, rest: t.rest || 90, target: tmap[t.ex] || null }));

  return rows;
}
function loggedFor(ex){ return (sess && sess.date === todayKey() && sess.day === day) ? sess.sets.filter(s => s.ex === ex) : []; }
function lastSets(ex){ return (boot && boot.last && boot.last[ex]) ? boot.last[ex].sets : []; }
function baseFor(ex){ const b = (sess && sess.base) || (boot && boot.bests) || {}; return b[ex] || null; }
const dk = (ex, si) => day + '|' + ex + '|' + si;
function rowDef(row, si){
  const last = lastSets(row.ex);
  if (row.target) return { w: num(row.target.w), reps: firstInt(row.target.reps, row.lo) };
  if (last[si]) return { w: num(last[si][1]), reps: num(last[si][2]) };
  if (last.length) { const l = last[last.length-1]; return { w: num(l[1]), reps: num(l[2]) }; }
  if (si > 0) { const p = cur(row, si - 1); return { w: p.w, reps: p.reps }; }

}
function vals(row, si){ return Object.assign({ rir: '', form: '', help: '' }, rowDef(row, si), draft[dk(row.ex, si)] || {}); }
function cur(row, si){
  const rec = loggedFor(row.ex).find(s => s.set === si + 1);
  return rec ? { w: rec.w, reps: rec.reps, rir: rec.rir, form: rec.form, help: rec.help } : vals(row, si);
}
function captureInputs(){
  const inputs = document.querySelectorAll('#app input.in:not([data-done]):not([readonly])'); if (!inputs.length) return;
  const rows = plan();
  inputs.forEach(inp => {
    if (inp.value === inp.defaultValue) return;
    const r = rows[+inp.dataset.ei]; if (!r) return;
    const d = draft[dk(r.ex, +inp.dataset.si)] || (draft[dk(r.ex, +inp.dataset.si)] = {});

}
function sessVol(){ return sess ? sess.sets.reduce((a, s) => a + s.w * s.reps, 0) : 0; }

// ---- workout lifecycle
function newSess(base){
  const t = Date.now();
  sess = { id: uid(), date: todayKey(), day, start: t, ts: nowStr(new Date(t)), lastT: t, alerted: false, ended: false, base: JSON.parse(JSON.stringify(base || {})), sets: [] };
  store.set('sess', sess);
}
async function startWorkout(){
  if (running() || starting) return;
  starting = true; render();
  await Promise.race([refreshBoot(), new Promise(r => setTimeout(r, 3000))]);

}
function evalSession(){
  const by = {};

  else if (a === 'link') toggleLink(ei);
  else if (a === 'sync') forceSync();
  else if (a === 'syncmode') { const m = store.get('syncMode', 'live') === 'live' ? 'finish' : 'live'; store.set('syncMode', m); toast(m === 'live' ? 'Live: each set syncs right away' : 'Sets stay on this phone until you tap Finish'); render(); if (sheet && sheet.step === 'settings') renderSheet(); flush(); }
  else if (a === 'bodym') { bodyMetric = D.m; view = 'bodym'; render(); window.scrollTo(0, 0); }
  else if (a === 'bback') { view = 'body'; render(); window.scrollTo(0, 0); }
  else if (a === 'addbody') openSheet('addbody', { m: D.m });
  else if (a === 'savebody') { if (saveBodyValue(sheet.m, $('bv').value, $('bd').value)) { sheet = null; renderSheet(); } }
  else if (a === 'delbody') delBody(D.id);
  else if (a === 'expand') { xopen = D.cid; renderX(); }
  else if (a === 'xclose') { xopen = null; renderX(); render(); }
  else if (a === 'range') { const c = getChart(D.cid); if (c) { c.range = +D.r; saveCharts(); renderX(); render(); } }
  else if (a === 'rmchart') { if (confirm('Remove this chart from your dashboard?')) { charts = charts.filter(x => x.id !== D.cid); saveCharts(); xopen = null; renderX(); render(); } }
  else if (a === 'addchart') openSheet('chart');
  else if (a === 'addc') {
    const c = { id: uid(), type: D.t };
    if (D.t === 'body') c.metric = D.m;
    if (D.t === 'ex') { c.ex = $('exsel').value; c.metric = sheet.metric || 'e1'; }
    charts.push(c); saveCharts(); sheet = null; renderSheet(); render();
  }
  else if (a === 'sstep') openSheet(D.s, sheet || {});
  else if (a === 'smetric') { sheet.metric = D.m; renderSheet(); }
  else if (a === 'sheetclose') { sheet = null; renderSheet(); }
  else if (a === 'sheetbg') { if (e.target === t) { sheet = null; renderSheet(); } }
  else if (a === 'pickex') { addExerciseTo(D.n); sheet = null; renderSheet(); render(); }
  else if (a === 'rename') renameDay(D.d);
  else if (a === 'tmenu') openPop(t, D.d, D.cid);
  else if (a === 'cexp') { closePop(); xopen = D.cid; renderX(); }
  else if (a === 'crm') { closePop(); if (confirm('Remove this chart from your dashboard?')) { charts = charts.filter(x => x.id !== D.cid); saveCharts(); render(); } }
  else if (a === 'newt') newTemplate();
  else if (a === 'tedit' || a === 'trename' || a === 'tdup' || a === 'tarch' || a === 'tunarch' || a === 'tdelete') tmenuAct(a, D.d);
  else if (a === 'showarch') { showArch = !showArch; render(); window.scrollTo(0, 0); }
  else if (a === 'rmex') removeExercise(ei);
  else if (a === 'editdone') { editing = false; render(); window.scrollTo(0, 0); }
  else if (a === 'start') startWorkout();
  else if (a === 'finish') finishWorkout();
  else if (a === 'cancel') cancelWorkout();
  else if (a === 'summary') showSummary();
  else if (a === 'check') { loggedFor(plan()[ei].ex).find(s => s.set === si + 1) ? undo(ei, si) : logSet(ei, si); }
  else if (a === 'tags') { const r = plan()[ei]; if (!loggedFor(r.ex).find(s => s.set === si + 1)) tagToggle(ei, si); }
  else if (a === 'tag') tag(ei, si, D.f, D.v);
  else if (a === 'prev') usePrev(ei, si);
  else if (a === 'addset') addSet(ei);
  else if (a === 'add') addExercise();
  else if (a === 'cfg') { sheet = null; renderSheet(); cfg = null; render(); }
});
document.addEventListener('change', e => {
  const t = e.target; if (!t.matches || !t.matches('input.in')) return;
  if (t.dataset.done) editLogged(+t.dataset.ei, +t.dataset.si, t.dataset.f, t.value); else captureInputs();
});
document.addEventListener('input', e => { const t = e.target; if (t.id === 'exq') { exQ = t.value; $('exlist').innerHTML = exListHtml(exQ); } if (t.id === 'pq') $('plist').innerHTML = pickerList(t.value); });
document.addEventListener('focusin', e => { if (e.target.matches && e.target.matches('input.in, input.bi')) e.target.select(); });
function renderSetup(){
  $('hd').innerHTML = '';
  $('app').innerHTML = `<div class="setup"><h2>Lift Log setup</h2><p class="muted">Paste your Apps Script web app URL and the secret you set in Code.gs. Stored only on this phone.</p>
    <label>Web app URL</label><input id="u" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(store.get('lastU',''))}">
    <label>Secret</label><input id="k" type="password"><button id="save">Save</button></div>`;
  $('save').onclick = () => { const u = $('u').value.trim(), k = $('k').value.trim(); if (!u || !k) return; cfg = { u, k }; store.set('cfg', cfg); store.set('lastU', u); boot = null; init(); };
}
function init(){
  if (sess && !sess.ended && sess.date !== todayKey()) { sess.ended = true; sess.summary = sess.summary || { dur: 0, vol: 0, sets: sess.sets.length, prs: [], by: {} }; store.set('sess', sess); }
  day = (running() ? sess.day : day) || defaultDay();
  const sv = store.get('view', 'home');
  view = running() ? 'day' : (['home', 'hist', 'body', 'prof', 'ex'].includes(sv) ? sv : 'home');
  hydrate(); render(); refreshBoot(); flush();
}

readQs();
window.addEventListener('online', () => { flush(); refreshBoot(); });
window.addEventListener('offline', updSync);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { flush(); if (!running()) refreshBoot(); tick(); } });
setInterval(tick, 1000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
init();
</script>
