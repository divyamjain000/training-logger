<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-512.png">
<title>Lift Log</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#262b36;--tx:#e8eaf0;--mut:#8a92a3;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--acc:#60a5fa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:calc(120px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:max(10px,env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:999px;padding:8px 13px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#07101f;font-weight:600}
.sync{margin-left:auto;font-size:12px;color:var(--mut);white-space:nowrap}
.sync b{color:var(--warn)}
.wk{margin-top:8px}
.startbtn{width:100%;height:46px;border:0;border-radius:12px;background:var(--ok);color:#06210f;font-size:17px;font-weight:700}
.startbtn:disabled{opacity:.6}
.clock{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.stat{font-size:13px;color:var(--mut)}
.fin{margin-left:auto;background:var(--bad);color:#2a0a0a;border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-size:15px}
.linkbtn{margin-left:auto;background:none;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:8px 14px;font-size:14px}
main{padding:10px 12px}
.ttl{font-size:20px;font-weight:700;margin-left:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{background:none;border:0;color:var(--acc);font-size:32px;line-height:1;padding:0 10px 4px 0}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.dcard.today{border-color:var(--acc)}
.dh{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.dt{font-size:19px;font-weight:700}
.dsub{font-size:12px;color:var(--mut)}
.ed{margin-left:auto;background:none;border:0;color:var(--mut);font-size:18px;padding:4px 8px}
.exl{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0;border-top:1px solid var(--line)}
.exl span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exl span:last-child{color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.more{font-size:12px;color:var(--mut);padding-top:6px}
.resume{background:#0f2a18;border:1px solid var(--ok);border-radius:14px;padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.resume b{font-variant-numeric:tabular-nums;font-size:20px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;padding:12px 10px}
.exh{display:flex;gap:8px;align-items:flex-start;padding:0 4px 8px}
.exh .t{font-weight:600}
.exh .s{font-size:12px;color:var(--mut);margin-top:2px}
.exh .n{margin-left:auto;font-size:13px;color:var(--mut);text-align:right;white-space:nowrap}
.xt{color:var(--acc);font-variant-numeric:tabular-nums}
.why{font-size:12px;color:var(--acc);margin-top:3px}
.sets{display:grid;grid-template-columns:36px 1fr 72px 62px 44px;gap:6px;align-items:center}
.sh{font-size:11px;color:var(--mut);text-align:center;text-transform:uppercase}
.sn{height:40px;border:0;background:#0c0e13;border-radius:8px;color:var(--tx);font-weight:700;font-size:15px}
.sn.tg{box-shadow:inset 0 0 0 1px var(--warn)}
.sn.pr{box-shadow:inset 0 0 0 1px var(--ok)}
.pv{height:40px;border:0;background:none;color:var(--mut);font-size:14px;font-variant-numeric:tabular-nums;padding:0}
.in{width:100%;min-width:0;height:40px;text-align:center;font-size:17px;font-weight:600;background:#0c0e13;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:0}
.in.done{background:#0f2a18;border-color:#1f5a34}
.ck{height:40px;border-radius:8px;border:1px solid var(--line);background:#0c0e13;color:transparent;font-size:20px;font-weight:700;padding:0}
.ck.on{background:var(--ok);border-color:var(--ok);color:#06210f}
.tagp{grid-column:1/-1;background:#0c0e13;border-radius:10px;padding:4px 10px 8px}
.tg{display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap}
.tg span{font-size:12px;color:var(--mut);width:52px}
.tg .chip{padding:6px 11px;font-size:13px}
.link{background:none;border:0;color:var(--mut);font-size:13px;padding:8px 4px}
.addset{width:100%;margin-top:8px;height:36px;border:0;border-radius:8px;background:#222733;color:var(--tx);font-size:14px}
.best{font-size:12px;color:var(--mut)}
.ssg{position:relative;padding-left:13px;margin-bottom:12px}
.ssg::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:3px;background:var(--c)}
.ssg .ex{margin-bottom:8px}.ssg .ex:last-of-type{margin-bottom:0}
.sstag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c);margin:0 0 5px 2px}
.exr{display:flex;gap:8px;margin-top:8px}.exr .addset{margin-top:0}
.lk{flex:0 0 auto;padding:0 12px;height:36px;border:0;border-radius:8px;background:#222733;color:var(--mut);font-size:13px}
.lk.on{background:var(--c);color:#0b0d12;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.grid2 .dcard{margin-bottom:0;padding:12px;min-width:0}
.grid2 .dt{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid2 .dh{flex-wrap:wrap;gap:0 8px;margin-bottom:6px}
.grid2 .exl{font-size:12px;padding:5px 0;gap:6px}
.pl{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.pl .r1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pl .t{font-weight:600}
.pl .sr{color:var(--acc);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.pl .s{font-size:12px;color:var(--mut);margin-top:3px}
.ssg .pl{margin-bottom:8px}.ssg .pl:last-of-type{margin-bottom:0}
.pbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(transparent,var(--bg) 35%);padding:26px 14px calc(12px + env(safe-area-inset-bottom))}
.tabs{display:flex;gap:8px;margin-top:8px}
.tabs .chip{flex:1;text-align:center}
.hc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.hc .ht{font-size:19px;font-weight:700}
.hc .hdt{font-size:13px;color:var(--mut);margin:2px 0 10px}
.hg{display:grid;grid-template-columns:1fr auto;gap:7px 14px;font-size:14px;border-top:1px solid var(--line);padding-top:10px}
.hg .hh{font-size:11px;color:var(--mut);text-transform:uppercase}
.hg .hh:nth-child(2),.hg .hv{text-align:right;color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.hg .hn{overflow:hidden;text-overflow:ellipsis}
.bar{position:fixed;left:0;right:0;bottom:0;background:#12151b;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:none;align-items:center;gap:12px;z-index:6}
.bar.on{display:flex}
.bar.go{background:#0f2a18;border-top-color:var(--ok)}
.bar .big{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));background:#222733;border:1px solid var(--line);padding:8px 14px;border-radius:10px;font-size:14px;z-index:9;display:none;max-width:90%;text-align:center}
.setup{padding:20px}
.setup input{width:100%;margin:6px 0 14px;padding:12px;background:#0c0e13;border:1px solid var(--line);border-radius:10px;color:var(--tx);font-size:15px}
.setup button{padding:12px 18px;border-radius:10px;border:0;background:var(--acc);font-weight:700}
.muted{color:var(--mut);font-size:13px}
.ov{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;padding:max(16px,env(safe-area-inset-top)) 16px 40px;display:none}
.ov.on{display:block}
.ov h2{margin:4px 0 14px}
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}
.kpi b{display:block;font-size:20px}
.kpi span{font-size:12px;color:var(--mut)}
.prrow{background:#0f2a18;border:1px solid #1f5a34;border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.prrow b{color:var(--ok)}
.vrow{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px}
.vrow span:last-child{color:var(--mut);font-variant-numeric:tabular-nums}
.closebtn{width:100%;height:50px;margin-top:18px;border:0;border-radius:12px;background:var(--acc);font-weight:700;font-size:16px}
</style>
</head>
<body>
<header id="hd"></header>
<main id="app"></main>
<div class="bar" id="bar"><div><div class="muted" id="barEx"></div><div class="big" id="barT">0:00</div></div></div>
<div class="toast" id="toast"></div>
<div class="ov" id="ov"></div>
<script>
'use strict';
const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday'];
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let cfg = store.get('cfg', null);
let boot = store.get('boot', null);
let queue = store.get('q', []);
let sess = store.get('sess', null);
let day = null, view = 'home', extra = store.get('extra', {}), xs = store.get('xs', {}), names = store.get('names', {}), links = store.get('links', {}), draft = {}, flushing = false, starting = false;

// ---- helpers
const pad = n => String(n).padStart(2, '0');
function nowStr(d = new Date()){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
function todayKey(){ return nowStr().slice(0,10); }
function defaultDay(){ const g = new Date().getDay(); return (g >= 1 && g <= 5) ? DAYS[g-1] : 'Monday'; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function toast(m, ms = 2200){ const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', ms); }
function num(v, d = 0){ const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? d : n; }
function firstInt(v, d = 0){ const m = String(v).match(/\d+/); return m ? parseInt(m[0], 10) : d; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtW(w){ return Number.isInteger(w) ? String(w) : String(+w.toFixed(2)); }
function fmtDur(s){ s = Math.max(0, Math.floor(s)); const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), x = s%60; return h ? `${h}:${pad(m)}:${pad(x)}` : `${m}:${pad(x)}`; }
function fmtVol(v){ return Math.round(v).toLocaleString('en-US'); }
function e1rm(w, r){ return (w > 0 && r >= 1 && r <= 12) ? w * (1 + r/30) : 0; }
function stepFor(ex){
  const e = ex.toLowerCase();
  if (/barbell|squat|deadlift|bench|hip thrust|press \(machine\)|leg press|hack/.test(e)) return 2.5;
  if (/cable|machine|pulldown|row|fly|curl|raise|pull/.test(e)) return 1.25;
  return 2.5;
}
function running(){ return !!(sess && !sess.ended && sess.date === todayKey()); }
function restFor(ex){ const t = boot && boot.template.find(x => x.ex === ex); return (t && t.rest) || 90; }

// ---- data
function readQs(){
  const q = new URLSearchParams(location.search);
  if (q.get('u') && q.get('k')) { cfg = { u: q.get('u'), k: q.get('k') }; store.set('cfg', cfg); history.replaceState(null, '', location.pathname); }
}
async function refreshBoot(){
  if (!cfg || !navigator.onLine) return;
  try {
    const r = await fetch(cfg.u + (cfg.u.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(cfg.k), { redirect: 'follow' });
    const j = await r.json();
    if (j.error) { toast('Script says: ' + j.error); return; }
    boot = j; store.set('boot', boot); captureInputs(); render();
  } catch(e){ /* offline or cold start, keep cache */ }
}
function sendable(){
  const v4 = boot && boot.v >= 4, v2 = boot && boot.v >= 2;
  return queue.filter(x => x.kind === 'set' || (x.kind === 'finish' && v2) || ((x.kind === 'delete' || x.kind === 'update') && v4));
}
async function flush(){
  if (!cfg || flushing || !queue.length || !navigator.onLine) { updSync(); return; }
  const send = sendable().slice(0, 60);
  if (!send.length) { updSync(); return; }
  flushing = true; updSync();
  const strip = o => { const c = Object.assign({}, o); delete c.kind; return c; };
  const rows = send.filter(x => x.kind === 'set'), fins = send.filter(x => x.kind === 'finish');
  const dels = send.filter(x => x.kind === 'delete'), ups = send.filter(x => x.kind === 'update');
  try {
    const r = await fetch(cfg.u, { method: 'POST', redirect: 'follow', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({ key: cfg.k, rows: rows.map(strip), finishes: fins.map(strip), deletes: dels.map(x => x.id), updates: ups.map(strip) }) });
    const j = await r.json();
    if (j.ok) {
      const done = new Set(j.ids), sent = new Set(send);
      queue = queue.filter(x => !(sent.has(x) && done.has(x.id))); store.set('q', queue);
      if (sess) { sess.sets.forEach(s => { if (rows.some(x => x.id === s.id)) s.synced = true; }); store.set('sess', sess); }
      if (!queue.length && !running()) setTimeout(refreshBoot, 600);
    } else toast('Sync: ' + (j.error || 'failed'));
  } catch(e){ /* stay queued */ }
  flushing = false; updSync();
  if (sendable().length && navigator.onLine) setTimeout(flush, 4000);
}
function updSync(){
  const el = $('sync'); if (!el) return;
  el.innerHTML = queue.length ? `<b>${queue.length} unsynced</b>` : (navigator.onLine ? 'synced' : 'offline');
}

// ---- supersets
const PAL = ['#f472b6','#fbbf24','#34d399','#a78bfa','#fb923c','#22d3ee'];
function ssMap(rows, d){
  const L = links[d] || {}, out = rows.map(() => null); let g = 0, i = 0;
  while (i < rows.length) {
    let j = i; while (j < rows.length - 1 && L[rows[j].ex]) j++;
    if (j > i) { for (let k = i; k <= j; k++) out[k] = { g, color: PAL[g % PAL.length], first: k === i, last: k === j }; g++; }
    i = j + 1;
  }
  return out;
}
function toggleLink(ei){
  const rows = plan(); if (ei >= rows.length - 1) return;
  const L = links[day] || (links[day] = {}); const ex = rows[ei].ex;
  if (L[ex]) delete L[ex]; else L[ex] = true;
  store.set('links', links); render();
}

// ---- model
function label(d){ return names[d] || d; }
function plan(d = day){
  if (!boot) return [];
  const tmpl = boot.template.filter(t => t.day === d).sort((a,b) => a.order - b.order);
  const tg = boot.targets.filter(t => t.day === d);
  const latest = tg.reduce((m, t) => t.date > m ? t.date : m, '');
  const tmap = {}; tg.filter(t => t.date === latest).forEach(t => tmap[t.ex] = t);
  const rows = tmpl.map(t => ({ ex: t.ex, sets: t.sets, lo: t.lo, hi: t.hi, rest: t.rest || 90, target: tmap[t.ex] || null }));
  (extra[d] || []).forEach(ex => { if (!rows.find(r => r.ex === ex)) rows.push({ ex, sets: 3, lo: 8, hi: 12, rest: 90, target: null }); });
  return rows;
}
function loggedFor(ex){ return (sess && sess.date === todayKey() && sess.day === day) ? sess.sets.filter(s => s.ex === ex) : []; }
function lastSets(ex){ return (boot && boot.last && boot.last[ex]) ? boot.last[ex].sets : []; }
function baseFor(ex){ const b = (sess && sess.base) || (boot && boot.bests) || {}; return b[ex] || null; }
const dk = (ex, si) => day + '|' + ex + '|' + si;
function rowDef(row, si){
  const last = lastSets(row.ex);
  if (row.target) return { w: num(row.target.w), reps: firstInt(row.target.reps, row.lo) };
  if (last[si]) return { w: num(last[si][1]), reps: num(last[si][2]) };
  if (last.length) { const l = last[last.length-1]; return { w: num(l[1]), reps: num(l[2]) }; }
  if (si > 0) { const p = cur(row, si - 1); return { w: p.w, reps: p.reps }; }
  return { w: 0, reps: row.lo || 8 };
}
function vals(row, si){ return Object.assign({ rir: '', form: '', help: '' }, rowDef(row, si), draft[dk(row.ex, si)] || {}); }
function cur(row, si){
  const rec = loggedFor(row.ex).find(s => s.set === si + 1);
  return rec ? { w: rec.w, reps: rec.reps, rir: rec.rir, form: rec.form, help: rec.help } : vals(row, si);
}
function captureInputs(){
  const inputs = document.querySelectorAll('#app input.in:not([data-done]):not([readonly])'); if (!inputs.length) return;
  const rows = plan();
  inputs.forEach(inp => {
    if (inp.value === inp.defaultValue) return;
    const r = rows[+inp.dataset.ei]; if (!r) return;
    const d = draft[dk(r.ex, +inp.dataset.si)] || (draft[dk(r.ex, +inp.dataset.si)] = {});
    d[inp.dataset.f] = inp.dataset.f === 'w' ? num(inp.value) : Math.round(num(inp.value));
  });
}
function sessVol(){ return sess ? sess.sets.reduce((a, s) => a + s.w * s.reps, 0) : 0; }

// ---- workout lifecycle
function newSess(base){
  const t = Date.now();
  sess = { id: uid(), date: todayKey(), day, start: t, ts: nowStr(new Date(t)), lastT: t, alerted: false, ended: false, base: JSON.parse(JSON.stringify(base || {})), sets: [] };
  store.set('sess', sess);
}
async function startWorkout(){
  if (running() || starting) return;
  starting = true; render();
  await Promise.race([refreshBoot(), new Promise(r => setTimeout(r, 3000))]);
  newSess(boot && boot.bests); starting = false; view = 'day'; render(); window.scrollTo(0, 0); tick();
}
function evalSession(){
  const by = {};
  sess.sets.forEach(s => {
    const e = by[s.ex] || (by[s.ex] = { vol: 0, maxW: 0, e1: 0, n: 0 });
    e.vol += s.w * s.reps; e.n++;
    if (s.reps > 0 && s.w > e.maxW) e.maxW = s.w;
    e.e1 = Math.max(e.e1, e1rm(s.w, s.reps));
  });
  const prs = [];
  Object.keys(by).forEach(ex => {
    const e = by[ex], b = baseFor(ex); if (!b) return;
    const parts = [];
    if (e.maxW > 0 && b.maxW > 0 && e.maxW > b.maxW) parts.push(`heaviest set ${fmtW(e.maxW)} kg (was ${fmtW(b.maxW)})`);
    if (e.e1 > 0 && b.e1rm > 0 && e.e1 > b.e1rm + 0.05) parts.push(`est. 1RM ${e.e1.toFixed(1)} kg (was ${b.e1rm})`);
    if (e.vol > 0 && b.vol > 0 && e.vol > b.vol) parts.push(`volume ${fmtVol(e.vol)} kg (was ${fmtVol(b.vol)})`);
    if (parts.length) prs.push({ ex, parts });
  });
  return { by, prs, vol: sess.sets.reduce((a, s) => a + s.w * s.reps, 0), sets: sess.sets.length };
}
function finishWorkout(){
  if (!running()) return;
  if (!sess.sets.length) { if (!confirm('No sets logged. Discard this workout?')) return; sess = null; store.set('sess', null); render(); return; }
  if (!confirm('Finish workout?')) return;
  const end = Date.now(); const ev = evalSession();
  sess.ended = true; sess.endT = end;
  const durMin = Math.round((end - sess.start) / 6000) / 10;
  sess.summary = { dur: Math.round((end - sess.start) / 1000), vol: ev.vol, sets: ev.sets, prs: ev.prs, by: ev.by };
  store.set('sess', sess);
  queue.push({ kind: 'finish', id: sess.id, date: sess.date, day: sess.day, start: sess.ts, end: nowStr(new Date(end)), durMin, volume: Math.round(ev.vol), sets: ev.sets, prs: ev.prs.map(p => p.ex + ': ' + p.parts.join(', ')).join(' | ') });
  store.set('q', queue);
  draft = {}; xs = {}; store.set('xs', xs);
  $('bar').classList.remove('on');
  render(); showSummary(); flush();
}
function cancelWorkout(){
  if (!running()) return;
  const n = sess.sets.length, syn = sess.sets.filter(x => x.synced);
  const can = boot && boot.v >= 4;

// ---- set actions
function logSet(ei, si){
  const row = plan()[ei]; if (!row) return;
  const n = si + 1;
  if (loggedFor(row.ex).find(s => s.set === n)) return;
  const d = vals(row, si);
  if (!running()) newSess(boot && boot.bests);
  const now = Date.now();
  const rest = Math.round((now - sess.lastT) / 1000);
  const b = baseFor(row.ex);
  let pr = '';
  if (b) {
    if (d.w > 0 && b.maxW > 0 && d.w > b.maxW && d.reps > 0) pr = 'weight';
    else if (e1rm(d.w, d.reps) > (b.e1rm || 0) + 0.05 && b.e1rm > 0) pr = 'e1rm';
  }
  const rec = { id: uid(), ex: row.ex, set: n, w: d.w, reps: d.reps, rir: d.rir, form: d.form, help: d.help, t: now, pr, synced: false };
  sess.sets.push(rec); sess.lastT = now; sess.alerted = false; store.set('sess', sess);
  queue.push({ kind: 'set', id: rec.id, ts: sess.ts, day: sess.day, ex: row.ex, set: n, w: d.w, reps: d.reps, rest, rir: d.rir, form: d.form, help: d.help, note: '' });
  store.set('q', queue);
  if (pr) { toast(pr === 'weight' ? `🏆 New weight PR: ${fmtW(d.w)} kg` : `🏆 New est. 1RM PR: ${e1rm(d.w, d.reps).toFixed(1)} kg`, 3500); if (navigator.vibrate) navigator.vibrate([80,60,80]); }
  delete draft[dk(row.ex, si)];
  render(); tick(); flush();
}
function undo(ei, si){
  const row = plan()[ei]; if (!row) return;
  const rec = loggedFor(row.ex).find(s => s.set === si + 1); if (!rec) return;
  if (!running()) { toast('Workout is finished. Edit it in the sheet.'); return; }
  const pending = queue.find(q => q.kind === 'set' && q.id === rec.id);
  queue = queue.filter(q => q.id !== rec.id);
  if (!pending) { queue.push({ kind: 'delete', id: rec.id }); if (!(boot && boot.v >= 4)) toast('Removed here. Redeploy the script (v4) to remove it from the sheet too.', 4000); }
  store.set('q', queue);
  sess.sets = sess.sets.filter(s => s.id !== rec.id);
  sess.lastT = sess.sets.length ? sess.sets[sess.sets.length-1].t : sess.start; store.set('sess', sess);
  render(); flush();
}
function editLogged(ei, si, f, v){
  const row = plan()[ei]; if (!row || !running()) return;
  const rec = loggedFor(row.ex).find(x => x.set === si + 1); if (!rec) return;
  if (f === 'w') rec.w = num(v); else rec.reps = Math.round(num(v));
  store.set('sess', sess);
  const item = queue.find(q => q.id === rec.id);
  if (item) { item.w = rec.w; item.reps = rec.reps; }
  else queue.push({ kind: 'update', id: rec.id, w: rec.w, reps: rec.reps, rir: rec.rir, form: rec.form, help: rec.help });
  store.set('q', queue); tick(); flush();
}
function tagToggle(ei, si){ const r = plan()[ei]; const d = draft[dk(r.ex, si)] || (draft[dk(r.ex, si)] = {}); d.tags = !d.tags; render(); }
function tag(ei, si, f, v){ const r = plan()[ei]; const d = draft[dk(r.ex, si)] || (draft[dk(r.ex, si)] = {}); d[f] = d[f] === v ? '' : v; render(); }
function usePrev(ei, si){
  const r = plan()[ei]; const l = lastSets(r.ex)[si]; if (!l) return;
  const k = dk(r.ex, si); draft[k] = Object.assign(draft[k] || {}, { w: num(l[1]), reps: num(l[2]) }); render();
}
function addSet(ei){
  const r = plan()[ei]; const k = day + '|' + r.ex;
  const n = Math.max(xs[k] || 0, r.sets, loggedFor(r.ex).reduce((m, s) => Math.max(m, s.set), 0));

}

// ---- timers
function tick(){
  const run = running();
  if (run && $('clock')) { $('clock').textContent = fmtDur((Date.now() - sess.start) / 1000); $('volhdr').textContent = fmtVol(sessVol()) + ' kg · ' + sess.sets.length + ' sets'; }
  if (run && $('hclock')) $('hclock').textContent = fmtDur((Date.now() - sess.start) / 1000);
  if (boot && day && view === 'day') {
    const rows = plan();
    document.querySelectorAll('.xt').forEach(el => {
      const r = rows[+el.dataset.i]; if (!r) return;
      const mine = loggedFor(r.ex);
      if (!mine.length) { el.textContent = ''; return; }
      const active = run && sess.sets[sess.sets.length-1].ex === r.ex;
      const end = active ? Date.now() : mine[mine.length-1].t;
      el.textContent = '⏱ ' + fmtDur((end - mine[0].t) / 1000);
    });
  }
  const bar = $('bar');
  if (run && sess.sets.length) {
    const last = sess.sets[sess.sets.length-1];
    const el = (Date.now() - sess.lastT) / 1000;
    const srows = plan(sess.day), si0 = srows.findIndex(r => r.ex === last.ex);
    const linked = si0 >= 0 && si0 < srows.length - 1 && (links[sess.day] || {})[last.ex];
    const tg = linked ? Infinity : restFor(last.ex);
    bar.classList.add('on'); bar.classList.toggle('go', el >= tg);
    $('barEx').textContent = linked ? `Superset · next: ${srows[si0 + 1].ex}` : `Rest · ${last.ex} · target ${fmtDur(tg)}`;
    $('barT').textContent = fmtDur(el);
    if (el >= tg && !sess.alerted) { sess.alerted = true; store.set('sess', sess); if (navigator.vibrate) navigator.vibrate([200,100,200]); }
  } else bar.classList.remove('on');
}

function init(){
  if (sess && !sess.ended && sess.date !== todayKey()) { sess.ended = true; sess.summary = sess.summary || { dur: 0, vol: 0, sets: sess.sets.length, prs: [], by: {} }; store.set('sess', sess); }
  day = (running() ? sess.day : day) || defaultDay();
  view = running() ? 'day' : 'home';
  render(); refreshBoot(); flush();
}

readQs();
window.addEventListener('online', () => { flush(); refreshBoot(); });
window.addEventListener('offline', updSync);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { flush(); if (!running()) refreshBoot(); tick(); } });
setInterval(tick, 1000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
init();
</script>
