<title>Lift Log</title>
<style>

.vrow{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px}

.mrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--tx);padding:15px 16px}

/* soft, rounded look */
body{background:var(--bg)}

<body>
<header id="hd"></header>
<main id="app"></main>
<div class="bar" id="bar"><div><div class="muted" id="barEx"></div><div class="big" id="barT">0:00</div></div></div>
<div class="toast" id="toast"></div>
<nav class="nav" id="nav"></nav>
<div class="xov" id="xov"></div>
<div class="sheetbg" id="sheetbg" data-act="sheetbg"></div>
<div class="ov" id="ov"></div>
<script>
'use strict';
const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday'];
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let cfg = store.get('cfg', null);
let boot = store.get('boot', null);
let queue = store.get('q', []);
let sess = store.get('sess', null);
let pop = null, tlist = store.get('tlist', []), editing = false, showArch = false, arch = store.get('arch', {}), gone = store.get('gone', []), day = null, view = 'home', extra = store.get('extra', {}), xs = store.get('xs', {}), names = store.get('names', {}), links = store.get('links', {}), draft = {}, flushing = false, starting = false;

// ---- helpers
const pad = n => String(n).padStart(2, '0');
function nowStr(d = new Date()){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
function todayKey(){ return nowStr().slice(0,10); }
function defaultDay(){ const g = new Date().getDay(); return (g >= 1 && g <= 5) ? DAYS[g-1] : 'Monday'; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function toast(m, ms = 2200){ const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', ms); }
function num(v, d = 0){ const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? d : n; }

// ---- data
function readQs(){

}
async function refreshBoot(){
  if (!cfg || !navigator.onLine) return;
  try {
    const r = await fetch(cfg.u + (cfg.u.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(cfg.k), { redirect: 'follow' });
    const j = await r.json();
    if (j.error) { lastErr = j.error; toast(j.error === 'unauthorized' ? 'Wrong secret. Open settings and re-enter it.' : 'Script says: ' + j.error, 4000); return; }
    lastErr = ''; boot = j; store.set('boot', boot); captureInputs(); render();

}
function holding(){ return store.get('syncMode', 'live') === 'finish' && running(); }
function sendable(force){
  const hold = !force && holding();
  const v5 = boot && boot.v >= 5, v4 = boot && boot.v >= 4, v2 = boot && boot.v >= 2;
  return queue.filter(x => (hold && (x.kind === 'set' || x.kind === 'update' || x.kind === 'delete')) ? false : (x.kind === 'set' || (x.kind === 'finish' && v2) || ((x.kind === 'delete' || x.kind === 'update') && v4) || ((x.kind === 'body' || x.kind === 'bodydel') && v5) || (x.kind === 'tmpl' && boot && boot.v >= 6) || (x.kind === 'tdel' && boot && boot.v >= 7)));
}
let lastErr = '';
async function flush(force){

  flushing = true; updSync();
  const strip = o => { const c = Object.assign({}, o); delete c.kind; return c; };
  const rows = send.filter(x => x.kind === 'set'), fins = send.filter(x => x.kind === 'finish');
  const dels = send.filter(x => x.kind === 'delete'), ups = send.filter(x => x.kind === 'update');
  const bodies = send.filter(x => x.kind === 'body'), bdels = send.filter(x => x.kind === 'bodydel'), tadds = send.filter(x => x.kind === 'tmpl'), tdels = send.filter(x => x.kind === 'tdel');
  try {
    const r = await fetch(cfg.u, { method: 'POST', redirect: 'follow', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({ key: cfg.k, rows: rows.map(strip), finishes: fins.map(strip), deletes: dels.map(x => x.id), updates: ups.map(strip), body: bodies.map(strip), bodyDeletes: bdels.map(x => x.id), templateAdds: tadds.map(strip), templateDeletes: tdels.map(strip) }) });
    const j = await r.json();
    if (j.ok) {
      lastErr = '';
      const done = new Set(j.ids), sent = new Set(send);
      queue = queue.filter(x => !(sent.has(x) && done.has(x.id))); store.set('q', queue);
      if (sess) { sess.sets.forEach(s => { if (rows.some(x => x.id === s.id)) s.synced = true; }); store.set('sess', sess); }
      if (boot && (bodies.length || bdels.length)) {
        const gone = new Set(bdels.map(x => x.id));
        boot.body = (boot.body || []).filter(e => !gone.has(e.id) && !bodies.some(b => b.id === e.id)).concat(bodies.map(strip));
        store.set('boot', boot);
      }
      if (!queue.length && !running()) setTimeout(refreshBoot, 600);
    } else { lastErr = j.error || 'failed'; toast(lastErr === 'unauthorized' ? 'Wrong secret. Open settings and re-enter it.' : 'Sync: ' + lastErr, 4000); }
  } catch(e){ lastErr = 'network'; }
  flushing = false; updSync();
  if (sendable().length && navigator.onLine && lastErr !== 'unauthorized') setTimeout(flush, 4000);
}
async function forceSync(){
  if (!cfg) return;
  if (!navigator.onLine) { toast('Offline. It will sync when you have signal.'); return; }
  toast('Syncing…', 1500);
  await refreshBoot();
  if (lastErr !== 'unauthorized') { while (flushing) await new Promise(r => setTimeout(r, 200)); await flush(true); }
  const left = queue.length;
  if (!left) toast('All synced ✓');
  else if (lastErr === 'unauthorized') toast('Wrong secret. Open settings and re-enter it. Your data is safe on this phone.', 5000);
  else if (lastErr === 'network') toast("Can't reach the script. Check signal and the URL.", 4500);
  else toast(left + ' still waiting' + (boot && boot.v < 4 ? '. Update Code.gs in Apps Script.' : '.'), 4500);
}
function updSync(){
  const el = $('sync'); if (!el) return;
  el.innerHTML = queue.length ? (holding() ? `${queue.length} saved on phone · tap to sync` : `<b>${queue.length} unsynced · tap to sync</b>`) : (navigator.onLine ? 'synced ✓' : 'offline');
}

// ---- supersets
const PAL = ['#f472b6','#fbbf24','#34d399','#a78bfa','#fb923c','#22d3ee'];
function ssMap(rows, d){
  const L = links[d] || {}, out = rows.map(() => null); let g = 0, i = 0;
  while (i < rows.length) {
    let j = i; while (j < rows.length - 1 && L[rows[j].ex]) j++;
    if (j > i) { for (let k = i; k <= j; k++) out[k] = { g, color: PAL[g % PAL.length], first: k === i, last: k === j }; g++; }
    i = j + 1;
  }
  return out;
}
function toggleLink(ei){
  const rows = plan(); if (ei >= rows.length - 1) return;
  const L = links[day] || (links[day] = {}); const ex = rows[ei].ex;

// ---- model
function tmplRows(){

  return boot.template.filter(t => !dl.some(x => x.day === t.day && (!x.ex || x.ex === t.ex)));
}
function allTmpls(){
  const out = DAYS.filter(d => !gone.includes(d));
  tlist.forEach(d => { if (!out.includes(d) && !gone.includes(d)) out.push(d); });
  if (boot) tmplRows().forEach(t => { if (!out.includes(t.day) && !DAYS.includes(t.day) && !gone.includes(t.day)) out.push(t.day); });
  return out;
}
function label(d){ return names[d] || d; }
function plan(d = day){

  const tg = boot.targets.filter(t => t.day === d);
  const latest = tg.reduce((m, t) => t.date > m ? t.date : m, '');
  const tmap = {}; tg.filter(t => t.date === latest).forEach(t => tmap[t.ex] = t);
  const rows = tmpl.map(t => ({ ex: t.ex, sets: t.sets, lo: t.lo, hi: t.hi, rest: t.rest || 90, target: tmap[t.ex] || null }));
  (extra[d] || []).forEach(ex => { if (!rows.find(r => r.ex === ex)) { const x = exDefaults(ex); rows.push({ ex, sets: x.sets, lo: x.lo, hi: x.hi, rest: 90, target: null }); } });
  return rows;
}
function loggedFor(ex){ return (sess && sess.date === todayKey() && sess.day === day) ? sess.sets.filter(s => s.ex === ex) : []; }
function lastSets(ex){ return (boot && boot.last && boot.last[ex]) ? boot.last[ex].sets : []; }
function baseFor(ex){ const b = (sess && sess.base) || (boot && boot.bests) || {}; return b[ex] || null; }
const dk = (ex, si) => day + '|' + ex + '|' + si;
function rowDef(row, si){
  const last = lastSets(row.ex);

  if (last[si]) return { w: num(last[si][1]), reps: num(last[si][2]) };
  if (last.length) { const l = last[last.length-1]; return { w: num(l[1]), reps: num(l[2]) }; }
  if (si > 0) { const p = cur(row, si - 1); return { w: p.w, reps: p.reps }; }

function vals(row, si){ return Object.assign({ rir: '', form: '', help: '' }, rowDef(row, si), draft[dk(row.ex, si)] || {}); }
function cur(row, si){

}
function captureInputs(){

  const rows = plan();

function sessVol(){ return sess ? sess.sets.reduce((a, s) => a + s.w * s.reps, 0) : 0; }

// ---- workout lifecycle
function newSess(base){
  const t = Date.now();
  sess = { id: uid(), date: todayKey(), day, start: t, ts: nowStr(new Date(t)), lastT: t, alerted: false, ended: false, base: JSON.parse(JSON.stringify(base || {})), sets: [] };

}
async function startWorkout(){
  if (running() || starting) return;
  starting = true; render();
  await Promise.race([refreshBoot(), new Promise(r => setTimeout(r, 3000))]);
  newSess(boot && boot.bests); starting = false; view = 'day'; render(); window.scrollTo(0, 0); tick();
}
function evalSession(){
  const by = {};
  sess.sets.forEach(s => {
    const e = by[s.ex] || (by[s.ex] = { vol: 0, maxW: 0, e1: 0, n: 0 });
    e.vol += s.w * s.reps; e.n++;
    if (s.reps > 0 && s.w > e.maxW) e.maxW = s.w;
    e.e1 = Math.max(e.e1, e1rm(s.w, s.reps));
  });

    const e = by[ex], b = baseFor(ex); if (!b) return;
    const parts = [];
    if (e.maxW > 0 && b.maxW > 0 && e.maxW > b.maxW) parts.push(`heaviest set ${fmtW(e.maxW)} kg (was ${fmtW(b.maxW)})`);
    if (e.e1 > 0 && b.e1rm > 0 && e.e1 > b.e1rm + 0.05) parts.push(`est. 1RM ${e.e1.toFixed(1)} kg (was ${b.e1rm})`);
    if (e.vol > 0 && b.vol > 0 && e.vol > b.vol) parts.push(`volume ${fmtVol(e.vol)} kg (was ${fmtVol(b.vol)})`);
    if (parts.length) prs.push({ ex, parts });

}
function finishWorkout(){

  sess.ended = true; sess.endT = end;
  const durMin = Math.round((end - sess.start) / 6000) / 10;
  sess.summary = { dur: Math.round((end - sess.start) / 1000), vol: ev.vol, sets: ev.sets, prs: ev.prs, by: ev.by };
  store.set('sess', sess);
  queue.push({ kind: 'finish', id: sess.id, date: sess.date, day: sess.day, start: sess.ts, end: nowStr(new Date(end)), durMin, volume: Math.round(ev.vol), sets: ev.sets, prs: ev.prs.map(p => p.ex + ': ' + p.parts.join(', ')).join(' | ') });

}
function cancelWorkout(){
  if (!running()) return;

  const can = boot && boot.v >= 4;
  const msg = n ? `Cancel this workout? ${n} logged set${n > 1 ? 's' : ''} will be discarded.` + (syn.length ? (can ? `\n\n${syn.length} already in your sheet will be removed from it.` : `\n\n${syn.length} already in your sheet will stay there.`) : '') : 'Cancel this workout?';

}

  const exs = Object.keys(s.by).sort((a, b) => s.by[b].vol - s.by[a].vol);

// ---- set actions
function logSet(ei, si){
  const row = plan()[ei]; if (!row) return;
  const n = si + 1;
  if (loggedFor(row.ex).find(s => s.set === n)) return;
  const d = vals(row, si);
  if (!running()) newSess(boot && boot.bests);
  const now = Date.now();
  const rest = Math.round((now - sess.lastT) / 1000);
  const b = baseFor(row.ex);
  let pr = '';
  if (b) {
    if (d.w > 0 && b.maxW > 0 && d.w > b.maxW && d.reps > 0) pr = 'weight';
    else if (e1rm(d.w, d.reps) > (b.e1rm || 0) + 0.05 && b.e1rm > 0) pr = 'e1rm';
  }
  const rec = { id: uid(), ex: row.ex, set: n, w: d.w, reps: d.reps, rir: d.rir, form: d.form, help: d.help, t: now, pr, synced: false };
  sess.sets.push(rec); sess.lastT = now; sess.alerted = false; store.set('sess', sess);
  queue.push({ kind: 'set', id: rec.id, ts: sess.ts, day: sess.day, ex: row.ex, set: n, w: d.w, reps: d.reps, rest, rir: d.rir, form: d.form, help: d.help, note: '' });
  store.set('q', queue);
  if (pr) { toast(pr === 'weight' ? `🏆 New weight PR: ${fmtW(d.w)} kg` : `🏆 New est. 1RM PR: ${e1rm(d.w, d.reps).toFixed(1)} kg`, 3500); if (navigator.vibrate) navigator.vibrate([80,60,80]); }
  delete draft[dk(row.ex, si)];
  render(); tick(); flush();
}
function undo(ei, si){
  const row = plan()[ei]; if (!row) return;
  const rec = loggedFor(row.ex).find(s => s.set === si + 1); if (!rec) return;
  if (!running()) { toast('Workout is finished. Edit it in the sheet.'); return; }
  const pending = queue.find(q => q.kind === 'set' && q.id === rec.id);
  queue = queue.filter(q => q.id !== rec.id);
  if (!pending) { queue.push({ kind: 'delete', id: rec.id }); if (!(boot && boot.v >= 4)) toast('Removed here. Redeploy the script (v4) to remove it from the sheet too.', 4000); }
  store.set('q', queue);
  sess.sets = sess.sets.filter(s => s.id !== rec.id);
  sess.lastT = sess.sets.length ? sess.sets[sess.sets.length-1].t : sess.start; store.set('sess', sess);
  render(); flush();
}
function editLogged(ei, si, f, v){
  const row = plan()[ei]; if (!row || !running()) return;
  const rec = loggedFor(row.ex).find(x => x.set === si + 1); if (!rec) return;
  if (f === 'w') rec.w = num(v); else rec.reps = Math.round(num(v));
  store.set('sess', sess);
  const item = queue.find(q => q.id === rec.id);
  if (item) { item.w = rec.w; item.reps = rec.reps; }
  else queue.push({ kind: 'update', id: rec.id, w: rec.w, reps: rec.reps, rir: rec.rir, form: rec.form, help: rec.help });
  store.set('q', queue); tick(); flush();
}

function lastDone(d){

  else if (a === 'editdone') { editing = false; render(); window.scrollTo(0, 0); }

  else if (a === 'finish') finishWorkout();
  else if (a === 'cancel') cancelWorkout();
  else if (a === 'summary') showSummary();
  else if (a === 'check') { loggedFor(plan()[ei].ex).find(s => s.set === si + 1) ? undo(ei, si) : logSet(ei, si); }
  else if (a === 'tags') { const r = plan()[ei]; if (!loggedFor(r.ex).find(s => s.set === si + 1)) tagToggle(ei, si); }
  else if (a === 'tag') tag(ei, si, D.f, D.v);
  else if (a === 'prev') usePrev(ei, si);
  else if (a === 'addset') addSet(ei);
  else if (a === 'add') addExercise();
  else if (a === 'cfg') { cfg = null; render(); }
});
document.addEventListener('change', e => {
  const t = e.target; if (!t.matches || !t.matches('input.in')) return;
  if (t.dataset.done) editLogged(+t.dataset.ei, +t.dataset.si, t.dataset.f, t.value); else captureInputs();
});
document.addEventListener('input', e => { const t = e.target; if (t.id === 'pq') $('plist').innerHTML = pickerList(t.value); });
document.addEventListener('focusin', e => { if (e.target.matches && e.target.matches('input.in, input.bi')) e.target.select(); });
function renderSetup(){
  $('hd').innerHTML = '';
  $('app').innerHTML = `<div class="setup"><h2>Lift Log setup</h2><p class="muted">Paste your Apps Script web app URL and the secret you set in Code.gs. Stored only on this phone.</p>
    <label>Web app URL</label><input id="u" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(store.get('lastU',''))}">
    <label>Secret</label><input id="k" type="password"><button id="save">Save</button></div>`;
  $('save').onclick = () => { const u = $('u').value.trim(), k = $('k').value.trim(); if (!u || !k) return; cfg = { u, k }; store.set('cfg', cfg); store.set('lastU', u); boot = null; init(); };
}
function init(){
  if (sess && !sess.ended && sess.date !== todayKey()) { sess.ended = true; sess.summary = sess.summary || { dur: 0, vol: 0, sets: sess.sets.length, prs: [], by: {} }; store.set('sess', sess); }
  day = (running() ? sess.day : day) || defaultDay();
  const sv = store.get('view', 'home');
  view = running() ? 'day' : (['home', 'hist', 'body', 'prof'].includes(sv) ? sv : 'home');
  render(); refreshBoot(); flush();
}

readQs();
window.addEventListener('online', () => { flush(); refreshBoot(); });
window.addEventListener('offline', updSync);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { flush(); if (!running()) refreshBoot(); tick(); } });
setInterval(tick, 1000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
init();
</script>
